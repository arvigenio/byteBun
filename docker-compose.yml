# Local development: web (Vite) + api (NestJS) + db (SQL Server).
# Start everything:  docker compose up --build   then open http://localhost:5173
#
# Values come from .env when it exists (Compose reads it automatically).
# Every value has a dev-only default, so a fresh checkout runs without a .env file.
# The defaults are for local use only; production requires real values (see docker-compose.prod.yml).

name: bytebun

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ByteBun_Dev_Pass1!}
    ports:
      # Localhost only, so SSMS or Azure Data Studio on this PC can connect.
      - "127.0.0.1:1433:1433"
    volumes:
      # A Docker volume, not a Windows folder: SQL Server crashes when its files sit on a
      # Windows mount (it needs Linux file permissions). The volume lives in Docker's own
      # disk, which is on D: (D:\Docker\wsl\Ubuntu\ext4.vhdx). Delete with: npm run reset-db
      - mssql-dev-data:/var/opt/mssql
    healthcheck:
      # SQLCMDPASSWORD avoids shell-quoting problems with symbols in the password.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q \"SELECT 1\" > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [bytebun]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-bytebun}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-ByteBun_Dev_Pass1!}
      DB_TRUST_SERVER_CERT: ${DB_TRUST_SERVER_CERT:-true}
      LEADS_RATE_LIMIT_MAX: ${LEADS_RATE_LIMIT_MAX:-5}
      LEADS_RATE_LIMIT_WINDOW_MINUTES: ${LEADS_RATE_LIMIT_WINDOW_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      CHECKPOINT_DISABLE: "1" # no Prisma CLI telemetry/update checks
    ports:
      - "127.0.0.1:${API_PORT:-4000}:${API_PORT:-4000}"
    volumes:
      - ./backend:/app
      # Keep Linux node_modules inside the container, not on the Windows mount.
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [bytebun]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://api:${API_PORT:-4000}
      SITE_URL: ${SITE_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks: [bytebun]

volumes:
  mssql-dev-data:

networks:
  bytebun:
