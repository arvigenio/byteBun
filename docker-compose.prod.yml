# Production (VPS): one app container (site + API) and PostgreSQL.
# Run:  docker compose -f docker-compose.prod.yml up -d --build
#
# Every secret is required here; Compose stops with an error if one is missing from .env.
# The database port is NOT published. Only the app is reachable, and only on 127.0.0.1,
# so your reverse proxy (Nginx, Caddy, Traefik) is the only way in from the internet.

name: bytebun-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
    image: bytebun-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bytebun}
      DB_USER: ${DB_USER:-bytebun}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-false}
      LEADS_RATE_LIMIT_MAX: ${LEADS_RATE_LIMIT_MAX:-5}
      LEADS_RATE_LIMIT_WINDOW_MINUTES: ${LEADS_RATE_LIMIT_WINDOW_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      # Admin sign-in (see README "Admin sign-in")
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      LOGIN_PATH: ${LOGIN_PATH:?Set LOGIN_PATH in .env}
      ALERT_EMAILS: ${ALERT_EMAILS:?Set ALERT_EMAILS in .env}
      SECURITY_ALERT_WEBHOOK_URL: ${SECURITY_ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      MAIL_FROM: ${MAIL_FROM:-Byte Bun Admin <admin@bytebuntech.com>}
      LEADS_MAIL_FROM: ${LEADS_MAIL_FROM:-Byte Bun Tech <admin@bytebuntech.com>}
      LEADS_REPLY_TO: ${LEADS_REPLY_TO:-}
      # Public site URL: the reschedule/cancel links in lead emails point here.
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      CALL_MEETING_URL: ${CALL_MEETING_URL:-}
      # TESTING_EMAIL_ADDRESS is deliberately not passed: production always emails real recipients.
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    networks: [bytebun]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bytebun}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-bytebun}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks: [bytebun]

volumes:
  pg-data:

networks:
  bytebun:
